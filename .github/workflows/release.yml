name: release

# Push a tag vX.Y.Z that matches package.json. The package is staged through npm trusted
# publishing (OIDC, no token), with provenance; a maintainer approves it on npmjs.com with 2FA.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache in release builds
      - run: npm install -g npm@11.20.0 # trusted publishing needs npm 11.5.1 or later
      - run: npm ci
      - name: tag and package.json name the same version
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const { version } = require("./package.json");
            if (version !== tag) throw new Error(`tag ${tag}, package.json ${version}`);
          '
      - run: npm stage publish
